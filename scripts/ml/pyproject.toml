[project]
name = "alpha-defense-text-ml"
version = "0.1.0"
description = "Isolated offline text-model training for Alpha Defense"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib==1.5.3",
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "threadpoolctl==3.6.0",
]

[tool.uv]
required-version = "==0.11.7"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["joblib", "scipy", "sklearn", "sklearn.*"]
ignore_missing_imports = true
