[build-system]
requires = ["uv_build==0.12.14"]
build-backend = "uv_build"

[project]
name = "alpha-defense"
version = "0.1.0"
description = "Mock-only backend for the Alpha Defense prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.53",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "import-linter==2.15",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
    "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
default-groups = ["dev"]
required-version = "==0.11.7"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "migrations"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "alpha_defense"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent from outer layers and frameworks"
type = "forbidden"
source_modules = ["alpha_defense.domain"]
forbidden_modules = [
    "alembic",
    "alpha_defense.application",
    "alpha_defense.bootstrap",
    "alpha_defense.infrastructure",
    "alpha_defense.transport",
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Application is independent from adapters and frameworks"
type = "forbidden"
source_modules = ["alpha_defense.application"]
forbidden_modules = [
    "alembic",
    "alpha_defense.bootstrap",
    "alpha_defense.infrastructure",
    "alpha_defense.transport",
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not import delivery or composition"
type = "forbidden"
source_modules = ["alpha_defense.infrastructure"]
forbidden_modules = ["alpha_defense.bootstrap", "alpha_defense.transport"]

[[tool.importlinter.contracts]]
name = "Transport depends only on application contracts"
type = "forbidden"
source_modules = ["alpha_defense.transport"]
allow_indirect_imports = true
forbidden_modules = [
    "alembic",
    "alpha_defense.bootstrap",
    "alpha_defense.domain",
    "alpha_defense.infrastructure",
    "sqlalchemy",
]
